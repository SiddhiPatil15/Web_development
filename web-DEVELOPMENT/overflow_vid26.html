<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Overflow</title>
    <style>
        .box{
            width:30vw;
            height:10vh;
            border:2px solid black;
            overflow:auto;
            white-space:nowrap;
            text-overflow: ellipsis;

        }
    </style>
</head>
<body>
    <div class="box">
        I am a girl Lorem ipsum dolor sit, amet consectetur adipisicing elit. Optio quos molestiae suscipit repellat eius et, doloremque, quae culpa aliquam accusamus esse tempora quis consectetur accusantium quas, dolorum corrupti alias laudantium.
    </div>
</body>
</html>
