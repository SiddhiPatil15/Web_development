<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>
    <style>
    .box {
        border: 2px solid black;
        padding: 10px;
    }

    .text-element {
        text-shadow: 3px 7px 2px #48e1e1;
        outline:2px solid black;
        border:2px solid green;
        border-radius:50px;
    }
</style>
</head>

    <body><div class="box">I am a box </div><p class="text-element">Lorem,
    ipsum dolor sit amet consectetur adipisicing elit. Vel saepe praesentium molestias,
    laudantium architecto quam voluptate dolor ducimus officia iusto at minima ratione fuga asperiores laboriosam,
    nulla veniam unde ipsam. </p></body></html>
