<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card design</title><style>
     /*    *{
            margin:0px;
            padding:0px;
        } */
        .card-content{
            width:350px;
            padding: 20px;
            border: 3px solid rgb(236, 236, 236);
            border-radius: 40px;
            margin: right 70px;
            background-color: rgb(255, 254, 254);
        }
        .image img{
            width:100%;
            height: 300px;
            padding:1px;
            border-radius:30px;
        }
        .des{
            text-align: center;
            cursor:pointer;
            transition:all 0.3s ease;
        }
        .title{
            text-decoration:solid;
        }
        .p{
            color:gray;
        }
        ul{
            display:flex;
            padding: 10px;;
            gap: 5px;px;
        }
        li{
            padding:4px 10px;
            border: 0.5em solid rgb(255, 251, 251);
            border-radius:20px;
            cursor:pointer;
            background-color:rgb(245, 241, 241);
            transition:all 0.3s ease;
        }
        li:hover{
        background-color:blue;
        color:white;
        }
        .but{
         border:2px solid rgb(247, 240, 240);
         color: blue;
         padding:9px;
        border-radius:45px;
        cursor:pointer;
        }
        ul li{
            list-style-type: none ;
            color:gray;
        }
        .texi{
            color:gray;
        }
    </style>
</head>
<body>
    <div class="card-content">
    <div class="image">
     <img src="card_design.jpeg">
    </div>
    <div class="title">
        <ul>
            <li>Nature</li>
            <li>Lake</li>
            

        </ul>
<h2>Lago di Braies</h2>

    </div>
    <div class="des">
        <button class="but">Read More</button>
    </div>
    </div>
<div class="imgs">
 
</div>

</body>
</html>
