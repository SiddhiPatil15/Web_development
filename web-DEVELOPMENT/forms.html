<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First HTML Form</title>
</head><link rel="stylesheet"href="formi.css">
<body>

    <h1>User Registration Form</h1>

    <form action="/submit_form" method="post">

        <label for="username">Username:</label><br>
        <input type="text" id="username"placeholder="Enter full name" name="username" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password"placeholder="abc3x@gmail.com" name="password" required><br><br>

        <label for="message">Your Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>

        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
        <label for="newsletter">Subscribe to newsletter</label><br><br>

        <input type="radio" id="gender_male" name="gender" value="male">
        <label for="gender_male">Male</label><br>
        <input type="radio" id="gender_female" name="gender" value="female">
        <label for="gender_female">Female</label><br><br>

        <label for="country">Country:</label><br>
        <select id="country" name="country">
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">United Kingdom</option>
        </select><br><br>

        <input type="submit" value="Register">
   
    </form>
Made with &#128151 from Siddhi
</body>
</html>
